[log]
# the log level, one of "trace", "debug", "info", "warn", "error"
# optional, default is "info"
level = "info"

# the address to listen on
# no default value, must be set
[listen]
addr = "127.0.0.1:10000" # listen dual stack use [::]

# the database
# the path have no default value, must be set
[database]
path = "target/tmpdb/" # a directory, and it'd better not use a relative path
## three optional value, and the default are shown below
compression_factor = 5      # like zstd, 1-22
cache_capacity = 1073741824 # in bytes. in this case, 1GB
mode = "low_space"          # options are "low_space", "high_thoughtput"

# the garbage collection configuration
# default values are shown below
[garbage_collection]
lock = { expire_minute = 5 }
auto_delete = { max_days = 365, lazy = false }
