[package]
name = "lib-crypto-kv"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.97"
axum = { version = "0.8.1", default-features = false, features = [
    "http1",
    "tokio",
    "query",
] }
axum-extra = { version = "0.10.0", default-features = false, features = [
    "typed-header",
] }
base91 = { version = "0.1.0", default-features = false, features = [
    "canonical",
    "std",
] }
bincode = { version = "2.0.1", default-features = false, features = [
    "alloc",
    "serde",
] }
chrono = { version = "0.4.40", default-features = false, features = [
    "clock",
    "serde",
] }
clap = { version = "4.5.32", default-features = false, features = [
    "std",
    "derive",
    "usage",
    "help",
] }
env_logger = { version = "0.11.7", default-features = false }
log = "0.4.26"
rand = "0.9.0"
serde = { version = "1.0.219", features = ["derive"] }
sha3 = "0.10.8"
sled = { version = "0.34.7", features = ["zstd", "compression"] }
thiserror = "2.0.12"
tokio = { version = "1.44.1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "signal",
] }
toml = { version = "0.8.20", default-features = false, features = ["parse"] }
